name: CI

on:
  push:
  pull_request:

jobs:
  p0-quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
      - name: Validate checked-in data
        run: python scripts/validate_data.py
      - name: Validate fixture expectations
        run: python scripts/validate_fixtures.py
      - name: Verify generated schemas are current
        run: |
          python scripts/export_schemas.py
          git diff --exit-code -- schema/
