[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowvram"
version = "0.1.0"
description = "Open local-AI hardware compatibility data contracts and validation tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LowVRAM contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<3",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
lowvram = "lowvram.cli:app"

[tool.setuptools.packages.find]
include = ["lowvram*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["lowvram", "scripts"]
